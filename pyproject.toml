[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeca-lcss-repro"
version = "1.0.0"
description = "Reproduction code and data for deployment-aware control architecture co-design via mixed-integer output-feedback SLS."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Chenchen Zhou"},
]
dependencies = [
  "numpy>=2.2,<2.3",
  "scipy>=1.15,<1.16",
  "matplotlib>=3.10,<3.11",
  "cvxpy>=1.7,<1.8",
  "gurobipy>=13.0,<13.1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.urls]
Repository = "https://github.com/Daakuang/CoDeCA-LCSS-repro"

[tool.setuptools.packages.find]
include = ["repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
